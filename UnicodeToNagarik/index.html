    :root{color-scheme:light;--bg:#f6f7fb;--card:#fff;--text:#17172a;--muted:#686980;--line:#e5e7f0;--brand:#6d28d9;--brand2:#4f46e5;--soft:#f1edff;--good:#067647;--warn:#9a6700;--shadow:0 16px 45px rgba(34,25,84,.09)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 10% 0%,#ece7ff 0,transparent 36%),radial-gradient(ellipse at 100% 20%,#e4f3ff 0,transparent 28%),var(--bg);color:var(--text);line-height:1.5}
